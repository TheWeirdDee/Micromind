name: Send reminder pushes

# Triggers the agent's /api/cron/send-reminder-pushes endpoint, which sends a
# real Web Push notification to anyone who hasn't journaled in 24h and hasn't
# already been reminded in roughly the last day.
#
# Reuses the same two repo secrets as release-letters-cron.yml:
#   AGENT_API_URL — the agent's base URL (same value as NEXT_PUBLIC_AGENT_API_URL)
#   CRON_SECRET   — must match the CRON_SECRET env var set on the agent (Railway)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  send-reminder-pushes:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-reminder-pushes cron endpoint
        run: |
          curl --fail --show-error --silent \
            -X POST "${AGENT_API_URL}/api/cron/send-reminder-pushes" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          AGENT_API_URL: ${{ secrets.AGENT_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
